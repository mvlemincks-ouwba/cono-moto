name: APK Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Outils internes (pont Discord, panel de clients IA, CTPO) : ni build ni
    # nouvelle version. Les pull requests, elles, sont toujours vérifiées.
    paths-ignore:
      - ".claude/**"
      - "tool/clients/**"
      - "tool/feedback/**"
      - ".github/workflows/feedback-sync.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Analyse, tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Mises à jour automatiques : l'appli lit la release « derniere-version »
      # de ce dépôt (public), voir README.
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/derniere-version
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet sur main : le « quoi de neuf » liste les changements.
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: |
          flutter test
          python3 -m unittest discover -s tool/release

      # Les clés sont lues dans les secrets du dépôt (Settings › Secrets and variables › Actions).
      # Toutes sont optionnelles : sans Firebase, l'app fonctionne en solo.
      - name: Configuration de build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SHARE_VIEWER_URL: ${{ secrets.SHARE_VIEWER_URL }}
          DISCORD_FEEDBACK_WEBHOOK: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}
          APP_BUILD: ${{ github.run_number }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os
          keys = ["FIREBASE_API_KEY", "FIREBASE_APP_ID", "FIREBASE_MESSAGING_SENDER_ID",
                  "FIREBASE_PROJECT_ID", "FIREBASE_DATABASE_URL", "FIREBASE_STORAGE_BUCKET",
                  "TOMTOM_API_KEY", "SHARE_VIEWER_URL",
                  "DISCORD_FEEDBACK_WEBHOOK", "DISCORD_INVITE_URL", "UPDATE_BASE_URL", "APP_BUILD", "APP_COMMIT"]
          conf = {k: os.environ.get(k, "") for k in keys}
          with open("build-config.json", "w") as f:
              json.dump(conf, f)
          print("Firebase configuré :", all(conf[k] for k in keys[:4]) and bool(conf["FIREBASE_DATABASE_URL"]))
          print("TomTom configuré :", bool(conf["TOMTOM_API_KEY"]))
          EOF

      # Signature : clé fournie par les secrets si présente, sinon clé partagée du dépôt.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      # Un APK par architecture (≈ 40 Mo au lieu de 106 pour l'APK universel) :
      # arm64-v8a (presque tous les téléphones) devient cono-moto.apk, celui du
      # lien du mode d'emploi et le seul que lisent les versions d'avant (build 54,
      # champ `file` d'android.json) ; armeabi-v7a pour les vieux téléphones
      # 32 bits. Pas de x86_64 (émulateurs seulement).
      #
      # versionCode : avec --split-per-abi, le plugin Gradle de Flutter 3.47.6 le
      # remplace dans chaque APK par « code de l'ABI × 1000 + numéro de build »
      # (packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt, l. 673,
      # versionCodeOverride ; codes dans FlutterPluginConstants.kt, l. 39-45,
      # ABI_VERSION : armeabi-v7a = 1, arm64-v8a = 2, x86_64 = 4). Run 60 → 1060
      # (32 bits) et 2060 (arm64) : au-dessus des APK universels d'avant
      # (versionCode = numéro du run, 54 sur les téléphones) et croissant d'un run
      # à l'autre pour chaque ABI. Ne plus jamais publier d'APK universel ni
      # passer -P force-version-code-ignoring-abi=true : son versionCode (le
      # numéro du run) serait plus bas et Android refuserait la mise à jour.
      - name: Build APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=build-config.json
          # Garde-fou : chaque APK porte le versionCode attendu (voir plus haut).
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          for abi in arm64-v8a:2 armeabi-v7a:1; do
            apk="build/app/outputs/flutter-apk/app-${abi%%:*}-release.apk"
            expected=$(( ${abi##*:} * 1000 + ${{ github.run_number }} ))
            code="$([ -n "$aapt2" ] && "$aapt2" dump badging "$apk" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" || true)"
            if [ -z "$code" ]; then
              echo "::warning::versionCode de ${abi%%:*} non vérifié (aapt2 introuvable ou illisible)"
            elif [ "$code" != "$expected" ]; then
              echo "::error::${abi%%:*} : versionCode $code au lieu de $expected"
              exit 1
            fi
          done
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk cono-moto.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk cono-moto-armeabi-v7a.apk

      - uses: actions/upload-artifact@v6
        with:
          name: cono-moto-apk
          path: |
            cono-moto.apk
            cono-moto-armeabi-v7a.apk
          retention-days: 30

      # Sur main : les APK puis leur description (android.json) dans la release
      # « derniere-version », lien stable à partager. L'appli lit android.json
      # au démarrage pour se mettre à jour (`files` : l'APK de son architecture) ;
      # la page affiche le mode d'emploi.
      - name: Description de la version
        if: github.ref == 'refs/heads/main'
        run: |
          python3 tool/release/make_manifest.py android \
            --file cono-moto.apk \
            --abi-file arm64-v8a=cono-moto.apk \
            --abi-file armeabi-v7a=cono-moto-armeabi-v7a.apk \
            --build ${{ github.run_number }} \
            --version "$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" \
            --commit ${{ github.sha }} \
            --base-url "$UPDATE_BASE_URL" \
            --out build/release
          python3 tool/release/release_page.py "${{ github.repository }}" build/release/page.md

      - name: Release « derniere-version »
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: derniere-version
          name: Cono Moto (dernière version)
          prerelease: false
          make_latest: true
          body_path: build/release/page.md
          files: |
            cono-moto.apk
            cono-moto-armeabi-v7a.apk

      # Après les APK, pour que l'appli ne voie jamais une version pas encore en ligne.
      - name: Annonce de la version (android.json)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: derniere-version
          files: build/release/android.json

      - name: Release taguée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cono-moto.apk
            cono-moto-armeabi-v7a.apk
          generate_release_notes: true
