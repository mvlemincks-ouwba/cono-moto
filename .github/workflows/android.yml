name: APK Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Analyse, tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Mises à jour automatiques : l'appli lit la release « derniere-version »
      # de ce dépôt (public), voir README.
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/derniere-version
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet sur main : le « quoi de neuf » liste les changements.
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: |
          flutter test
          python3 -m unittest discover -s tool/release

      # Les clés sont lues dans les secrets du dépôt (Settings › Secrets and variables › Actions).
      # Toutes sont optionnelles : sans Firebase, l'app fonctionne en solo.
      - name: Configuration de build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SHARE_VIEWER_URL: ${{ secrets.SHARE_VIEWER_URL }}
          DISCORD_FEEDBACK_WEBHOOK: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}
          APP_BUILD: ${{ github.run_number }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os
          keys = ["FIREBASE_API_KEY", "FIREBASE_APP_ID", "FIREBASE_MESSAGING_SENDER_ID",
                  "FIREBASE_PROJECT_ID", "FIREBASE_DATABASE_URL", "FIREBASE_STORAGE_BUCKET",
                  "TOMTOM_API_KEY", "SHARE_VIEWER_URL",
                  "DISCORD_FEEDBACK_WEBHOOK", "DISCORD_INVITE_URL", "UPDATE_BASE_URL", "APP_BUILD", "APP_COMMIT"]
          conf = {k: os.environ.get(k, "") for k in keys}
          with open("build-config.json", "w") as f:
              json.dump(conf, f)
          print("Firebase configuré :", all(conf[k] for k in keys[:4]) and bool(conf["FIREBASE_DATABASE_URL"]))
          print("TomTom configuré :", bool(conf["TOMTOM_API_KEY"]))
          EOF

      # Signature : clé fournie par les secrets si présente, sinon clé partagée du dépôt.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=build-config.json
          cp build/app/outputs/flutter-apk/app-release.apk cono-moto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cono-moto-apk
          path: cono-moto.apk
          retention-days: 30

      # Sur main : l'APK puis sa description (android.json) dans la release
      # « derniere-version », lien stable à partager. L'appli lit android.json
      # au démarrage pour se mettre à jour ; la page affiche le mode d'emploi.
      - name: Description de la version
        if: github.ref == 'refs/heads/main'
        run: |
          python3 tool/release/make_manifest.py android \
            --file cono-moto.apk \
            --build ${{ github.run_number }} \
            --version "$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" \
            --commit ${{ github.sha }} \
            --base-url "$UPDATE_BASE_URL" \
            --out build/release
          python3 tool/release/release_page.py "${{ github.repository }}" build/release/page.md

      - name: Release « derniere-version »
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Cono Moto (dernière version)
          prerelease: false
          make_latest: true
          body_path: build/release/page.md
          files: cono-moto.apk

      # Après l'APK, pour que l'appli ne voie jamais une version pas encore en ligne.
      - name: Annonce de la version (android.json)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          files: build/release/android.json

      - name: Release taguée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cono-moto.apk
          generate_release_notes: true
