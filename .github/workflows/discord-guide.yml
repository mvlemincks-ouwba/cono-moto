name: Message Discord (ponctuel)

# Ponctuel : publie docs/discord/message.md (et l'image docs/discord/*.png s'il
# y en a une) dans le salon de la boîte à idées, via DISCORD_FEEDBACK_WEBHOOK.
on:
  push:
    branches: [claude/discord-guide]

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publication
        env:
          WEBHOOK: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, urllib.request, uuid
          url = os.environ.get("WEBHOOK", "").strip()
          if not url:
              sys.exit("::error::Secret DISCORD_FEEDBACK_WEBHOOK absent")
          content = open("docs/discord/message.md", encoding="utf-8").read().strip()
          if len(content) > 2000:
              sys.exit(f"::error::Message trop long ({len(content)} caractères)")
          # Seules les personnes citées explicitement (<@id>) sont notifiées.
          import re
          users = sorted(set(re.findall(r"<@!?(\d+)>", content)))
          payload = {"username": "Cono Moto", "content": content,
                     "allowed_mentions": {"parse": [], "users": users}}
          images = sorted(glob.glob("docs/discord/*.png"))
          headers = {"User-Agent": "DiscordBot (https://github.com/mvlemincks-ouwba/cono-moto, 1.0)"}
          if images:
              payload["attachments"] = [{"id": 0, "filename": os.path.basename(images[0])}]
              boundary = uuid.uuid4().hex
              body = b"".join([
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"payload_json\"\r\n"
                  f"Content-Type: application/json\r\n\r\n".encode(),
                  json.dumps(payload).encode(),
                  f"\r\n--{boundary}\r\nContent-Disposition: form-data; name=\"files[0]\"; "
                  f"filename=\"{os.path.basename(images[0])}\"\r\nContent-Type: image/png\r\n\r\n".encode(),
                  open(images[0], "rb").read(),
                  f"\r\n--{boundary}--\r\n".encode(),
              ])
              headers["Content-Type"] = f"multipart/form-data; boundary={boundary}"
          else:
              body = json.dumps(payload).encode()
              headers["Content-Type"] = "application/json"
          req = urllib.request.Request(url + "?wait=true", data=body, method="POST", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              msg = json.loads(r.read())
          print("Publié : message", msg.get("id"), "dans", msg.get("channel_id"))
          PY
